<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — iFaruk.Stores</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login">
  <div class="admin-login__card">
    <div class="admin-login__brand">
      <span class="brand">iFaruk<span>.Stores</span></span>
    </div>
    <p class="admin-login__sub">Admin Dashboard</p>

    <form data-login-form novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <p class="form-error" data-login-error role="alert" style="margin-bottom:16px;"></p>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
  </div>
</div>

<div id="toast-region"></div>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin/login.js"></script>
</body>
</html>
