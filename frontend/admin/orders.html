<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — iFaruk.Stores Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">iFaruk<span>.Stores</span></div>
    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="categories.html">Categories</a>
      <a href="orders.html" aria-current="page">Orders</a>
    </nav>
    <div class="admin-sidebar__footer">
      <p class="admin-sidebar__admin-name">Signed in as <span data-admin-name>—</span></p>
      <button type="button" class="btn btn-secondary btn-sm btn-block" data-admin-logout>Log Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Orders</h1>
    </div>

    <div class="admin-panel">
      <div class="admin-toolbar">
        <input type="search" class="form-control" placeholder="Search by order ID, name, or phone..." aria-label="Search orders" data-order-search style="max-width:320px;">
        <select class="form-control" aria-label="Filter by status" data-order-status-filter style="max-width:200px;">
          <option value="">All Statuses</option>
          <option value="New">New</option>
          <option value="Contacted">Contacted</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <table class="admin-table" data-orders-table>
        <thead>
          <tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="admin-cards" data-orders-cards></div>
    </div>
  </main>
</div>

<!-- Order detail modal -->
<div class="modal-overlay" data-order-modal hidden>
  <div class="modal" style="max-width:560px;text-align:left;max-height:90vh;overflow-y:auto;">
    <div class="admin-panel__header" style="padding:0 0 20px;border:none;">
      <h3>Order Details</h3>
      <button type="button" class="btn btn-secondary btn-sm" data-close-order-modal>Close</button>
    </div>
    <div data-order-modal-body></div>
  </div>
</div>

<div id="toast-region"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin/admin-common.js"></script>
<script src="../js/admin/orders-admin.js"></script>
</body>
</html>
