<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — iFaruk.Stores Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__brand">iFaruk<span>.Stores</span></div>
    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="categories.html" aria-current="page">Categories</a>
      <a href="orders.html">Orders</a>
    </nav>
    <div class="admin-sidebar__footer">
      <p class="admin-sidebar__admin-name">Signed in as <span data-admin-name>—</span></p>
      <button type="button" class="btn btn-secondary btn-sm btn-block" data-admin-logout>Log Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Categories</h1>
      <button type="button" class="btn btn-primary" data-add-category>+ Add Category</button>
    </div>

    <div class="admin-panel">
      <table class="admin-table" data-categories-table>
        <thead>
          <tr><th>Name</th><th>Type</th><th>Description</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="admin-cards" data-categories-cards></div>
    </div>
  </main>
</div>

<!-- Category create/edit modal -->
<div class="modal-overlay" data-category-modal hidden>
  <div class="modal" style="max-width:480px;text-align:left;">
    <div class="admin-panel__header" style="padding:0 0 20px;border:none;">
      <h3 data-category-modal-title>Add Category</h3>
      <button type="button" class="btn btn-secondary btn-sm" data-close-category-modal>Close</button>
    </div>

    <form data-category-form novalidate>
      <div class="form-group">
        <label class="form-label" for="category-name">Category Name</label>
        <input type="text" id="category-name" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="category-type">Type</label>
        <select id="category-type" name="type" class="form-control" required>
          <option value="watch">Luxury Watches</option>
          <option value="accessory">Fashion Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="category-description">Description (optional)</label>
        <textarea id="category-description" name="description" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Category</button>
    </form>
  </div>
</div>

<!-- Shared confirm modal -->
<div class="modal-overlay" data-confirm-modal hidden>
  <div class="modal">
    <h3 data-confirm-title>Are you sure?</h3>
    <p data-confirm-message></p>
    <div class="row-actions" style="justify-content:center;">
      <button type="button" class="btn btn-secondary" data-confirm-no>Cancel</button>
      <button type="button" class="btn btn-danger" data-confirm-yes>Confirm</button>
    </div>
  </div>
</div>

<div id="toast-region"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin/admin-common.js"></script>
<script src="../js/admin/categories-admin.js"></script>
</body>
</html>
